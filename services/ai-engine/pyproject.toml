[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ivs-ai-engine"
version = "2.0.0"
description = "Cognitive Vision & Multi-modal VLM for Inclusive Vision System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "google-genai>=1.0.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",
]
